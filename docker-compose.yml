services:
  web:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false     # для локального запуска .env не обязателен
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"

volumes:
  media_data: