{% load static i18n core_extras %}
<header id="top" class="header">
  <div class="wrap header-wrap">

    <div class="header-logos">
      <a href="{% url 'core:home' %}" class="brand">
        <img src="{% static 'img/logo-unilift-header.png' %}" alt="Unilift" class="main-logo">
      </a>
      <div class="logo-divider"></div>
      <img src="{% static 'img/logo-schindler-big.png' %}" alt="Schindler" class="hp-logo">
    </div>

    <div class="header-right">
      <nav class="menu">
        <a href="{% url 'core:home' %}#why">{% translate "О компании" %}</a>
        <a href="{% url 'core:home' %}#products">{% translate "Оборудование" %}</a>
        <a href="{% url 'projects:list' %}">{% translate "Проекты" %}</a>
      </nav>

      <div class="nav-cta">
        {% get_current_language as CURRENT_LANGUAGE %}
        <div class="lang-switch">
          <form action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{% lang_switch_url 'ru' %}">
            <input type="hidden" name="language" value="ru">
            <button type="submit" class="{% if CURRENT_LANGUAGE == 'ru' %}active{% endif %}">RU</button>
          </form>

          <form action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{% lang_switch_url 'ky' %}">
            <input type="hidden" name="language" value="ky">
            <button type="submit" class="{% if CURRENT_LANGUAGE == 'ky' %}active{% endif %}">KY</button>
          </form>
        </div>
        <a href="{% url 'core:home' %}#contacts" class="btn-primary">{% translate "Связаться" %}</a>
      </div>
    </div>
  </div>
</header>
