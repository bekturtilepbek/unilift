{% load i18n %}
<a href="{{ project.get_absolute_url }}" class="pcard-project">
  <div class="pimg">
    {% if project.cover %}
      <img src="{{ project.cover.url }}" alt="{{ project.title }}">
    {% else %}
      <span class="ph">{% translate "Фото объекта" %}</span>
    {% endif %}
    {% if project.category %}
      <span class="tag">{{ project.category.name|upper }}</span>
    {% endif %}
  </div>
  <div class="pbody">
    {% if project.category %}
      <div class="pcat">{{ project.category.name }}</div>
    {% endif %}
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
  </div>
</a>
