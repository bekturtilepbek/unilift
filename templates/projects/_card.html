{% load i18n %}
<a href="{{ project.get_absolute_url }}" class="pcard-project hover-card" data-aos="fade-up">
  <div class="pimg">
    {% if project.cover %}
      <img src="{{ project.cover.url }}" alt="{{ project.title }}">
    {% else %}
      <span class="ph">{% translate "Фото объекта" %}</span>
    {% endif %}
    {% if project.category %}
      <span class="tag">{{ project.category.name|upper }}</span>
    {% endif %}
  </div>
  <div class="pbody">
    <h3 class="line-clamp-2">{{ project.title }}</h3>
    <p class="line-clamp-3">{{ project.summary }}</p>
  </div>
</a>
