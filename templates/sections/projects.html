{% load i18n %}
{% if featured_projects %}
<section class="projects-section" id="projects">
  <div class="wrap">
    <h2 class="section-title" data-aos="fade-up">{% translate "Реализованные проекты" %}</h2>

    <div class="pgrid">
      {% for project in featured_projects %}
        {% include "projects/_card.html" %}
      {% endfor %}
    </div>

    <!-- Кнопка вынесена из сетки и отцентрирована -->
    <div class="projects-more" data-aos="fade-up">
      <a href="{% url 'projects:list' %}" class="btn btn-ghost">{% translate "Все проекты" %}</a>
    </div>
  </div>
</section>
{% endif %}
